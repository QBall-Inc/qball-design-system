<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Type — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Syne:wght@400;500;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <div class="row">
    <div class="label">H1 · Display</div>
    <div class="specimen" style="font-size:48px;font-weight:700;letter-spacing:-1.6px;line-height:1">Notes on building.</div>
    <div class="meta">Berkeley Mono · 700 · 56/-2</div>
  </div>
  <div class="row">
    <div class="label">H2 · Display</div>
