<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../packages/tokens/colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{background:var(--bg-primary);padding:20px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-sizing:border-box;font-family:var(--font-ui)}
  .row{display:grid;grid-template-columns:130px 90px 1fr;gap:18px;align-items:center;font-size:12px;color:var(--text-primary)}
  .name{color:var(--text-primary)}
  .val{color:var(--text-muted);letter-spacing:.3px}
  .track{position:relative;height:6px;background:var(--bg-surface);border-radius:3px;overflow:hidden}
  .dot{position:absolute;top:0;width:6px;height:6px;background:var(--color-signal);border-radius:50%;left:0}
  .f .dot{animation:slide 1.2s var(--ease-out) infinite alternate}
  .b .dot{animation:slide 2.0s var(--ease-out) infinite alternate}
  .s .dot{animation:slide 3.2s var(--ease-out) infinite alternate}
  @keyframes slide{from{left:0}to{left:calc(100% - 6px)}}
</style>
</head><body>
  <div class="row f"><div class="name">--dur-fast</div><div class="val">120ms</div><div class="track"><div class="dot"></div></div></div>
  <div class="row b"><div class="name">--dur-base</div><div class="val">200ms</div><div class="track"><div class="dot"></div></div></div>
  <div class="row s"><div class="name">--dur-slow</div><div class="val">360ms</div><div class="track"><div class="dot"></div></div></div>
  <div class="row" style="grid-template-columns:130px 1fr;color:var(--text-muted);font-size:11px;letter-spacing:.5px;margin-top:4px">
    <div>Easing</div><div>cubic-bezier(0.22, 1, 0.36, 1) — no bounce, no overshoot</div>
  </div>
</body></html>
