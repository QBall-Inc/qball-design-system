name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm version is read from the root package.json `packageManager` field
      # (pnpm@9.15.0) — the single source of truth. Do NOT also pass a `version`
      # input: action-setup v6 throws "Multiple versions of pnpm specified".
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # NFR1 dual-assertion font-license gate (RB-1) — the primary legal
      # safeguard, so it runs first after install to fail fast before the
      # heavier typecheck/lint/test. gate (a) npm pack tarballs + gate (b)
      # committed tree. Berkeley is never committed; injected only at
      # Pages-deploy (WP-B-5.1). No git-history scan (clean-by-construction).
      - name: License-clean gate (font binaries)
        run: pnpm run license-check

      # Icon-system codegen drift gate (WP-B-4b.2-B1) — the committed generated
      # icons (src/icons/generated/**) must match what scripts/generate-icons.mjs
      # reproduces from the pinned lucide-react@1.17.0 + the manifest. Runs before
      # typecheck so a stale commit or an un-regenerated pack bump fails loudly.
      - name: Icon codegen drift gate
        run: pnpm run generate:icons:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # NET-NEW SPDX / pack-license assertion (WP-B-4b.2, §12) — icon-pack devDeps
      # exact-pinned + declared SPDX (lucide ISC / simple-icons CC0) + per-file
      # provenance headers + MARKS.md ships. Distinct from the font-binary
      # license-check above (which neither trips on nor validates a code dep).
      - name: SPDX / pack-license assertion
        run: pnpm run spdx-check

      # WP-B-2.0a consumer distribution gate (RB-2) — the Strategy-2 shipped-CSS
      # delivery contract becomes a blocking pre-merge check. Packs the @qball-inc
      # tarballs (pnpm pack rewrites workspace:* to a real version, matching the
      # publish path), installs them into the throwaway fixtures/consumer app,
      # builds, and asserts .btn delivery + its self-contained token vars + the
      # optional token utility + a single Tailwind base block + a negative control.
      - name: Consumer distribution gate
        run: pnpm run consumer-validate
