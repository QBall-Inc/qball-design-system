name: Release

# Publishes @qball-inc/tokens + @qball-inc/react to npm via Changesets.
#
# Flow:
#   1. On push to main with pending changesets, Changesets opens/updates a
#      "Version Packages" PR (runs `changeset version` -> bumps versions +
#      writes per-package CHANGELOGs).
#   2. When that PR is merged (the changesets are consumed), this workflow runs
#      the topological publish (scripts/publish-packages.sh: tokens -> react).
#
# Auth: npm OIDC trusted publishing -- there is NO NPM_TOKEN anywhere in this
# workflow. The @qball-inc scope must have OIDC trusted publishing enabled on
# npmjs.org first (one-time owner action; see RELEASING.md). Provenance is
# attached via NPM_CONFIG_PROVENANCE, which needs id-token: write.

on:
  push:
    branches: [main]

permissions:
  contents: write # version-PR commits + git tags + GitHub releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm OIDC trusted publishing + provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Changesets needs full history to compute bumps

      # pnpm version is read from the root package.json `packageManager` field
      # (pnpm@9.15.0). Do NOT also pass a `version` input (action-setup v6 throws
      # "Multiple versions of pnpm specified").
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Full quality + font-license gate before any publish. The license gate
      # (scripts/license-check.sh, inside `pnpm run ci`) is the hard precondition
      # that no font binary reaches a published tarball (RB-1).
      - name: CI gates
        run: pnpm run ci

      - name: Version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: bash scripts/publish-packages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
